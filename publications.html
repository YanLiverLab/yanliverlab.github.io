  <meta charset="UTF-8">

  <meta
    name="description"
    content="YAN LAB publications — research in cholestatic liver disease, liver injury, and hepatotoxicity."
  >

  <title>Publications | YAN LAB</title>

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >

</head>

<body>

<header class="site-header">

  <div class="container nav-container">

    <a
      class="logo"
      href="index.html"
    >
      YAN LAB
    </a>

    <nav class="main-nav">

      <a href="index.html">Home</a>

      <a href="research.html">Research</a>

      <a href="people.html">People</a>

      <a
        class="active"
        href="publications.html"
      >
        Publications
      </a>

      <a href="funding.html">Funding</a>

      <a href="news.html">News</a>

      <a href="join-us.html">Join Us</a>

      <a href="contact.html">Contact</a>

    </nav>

  </div>

</header>


<main>

  <section class="page-hero">

    <div class="container">

      <p class="eyebrow">
        YAN LAB
      </p>

      <h1>
        Publications
      </h1>

      <p class="lead">
        Selected publications and research contributions
        from the YAN LAB.
      </p>

    </div>

  </section>


  <section class="publications-section">

    <div class="container">

      <div class="publication-links">

        <a
          class="button"
          href="https://orcid.org/0000-0003-4012-9557"
          target="_blank"
          rel="noopener"
        >
          ORCID
        </a>

        <a
          class="button button-secondary"
          href="https://scholar.google.com/citations?user=l6LJdzAAAAAJ&hl=en"
          target="_blank"
          rel="noopener"
        >
          Google Scholar
        </a>

      </div>


      <div
        id="publication-status"
        class="publication-status"
      >
        Loading publications...
      </div>


      <div
        id="publications-container"
        class="publications-list"
      >
      </div>


    </div>

  </section>

</main>


<footer class="site-footer">

  <div class="container">

    <p>
      © <span id="current-year"></span>
      YAN LAB. All rights reserved.
    </p>

    <p>
      Cholestatic Liver Disease · Liver Injury · Hepatotoxicity
    </p>

  </div>

</footer>


<script>

const publicationContainer =
  document.getElementById(
    "publications-container"
  );

const status =
  document.getElementById(
    "publication-status"
  );


function escapeHTML(value) {

  if (!value) return "";

  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function createPublicationCard(publication) {

  const title =
    escapeHTML(publication.title);

  const journal =
    escapeHTML(publication.journal);

  const year =
    escapeHTML(publication.year);

  let links = "";

  if (publication.doi_url) {

    links += `
      <a
        href="${escapeHTML(publication.doi_url)}"
        target="_blank"
        rel="noopener"
      >
        DOI
      </a>
    `;

  }

  if (publication.pubmed_url) {

    links += `
      <a
        href="${escapeHTML(publication.pubmed_url)}"
        target="_blank"
        rel="noopener"
      >
        PubMed
      </a>
    `;

  }

  if (!links && publication.url) {

    links += `
      <a
        href="${escapeHTML(publication.url)}"
        target="_blank"
        rel="noopener"
      >
        View publication
      </a>
    `;

  }

  return `

    <article class="publication-card">

      <div class="publication-year">
        ${year || ""}
      </div>

      <div class="publication-content">

        <h2>
          ${title}
        </h2>

        ${
          journal
            ? `<p class="publication-journal">
                 ${journal}
               </p>`
            : ""
        }

        <div class="publication-meta">
          ${links}
        </div>

      </div>

    </article>

  `;

}


function groupByYear(publications) {

  const groups = {};

  publications.forEach(publication => {

    const year =
      publication.year || "Other";

    if (!groups[year]) {
      groups[year] = [];
    }

    groups[year].push(publication);

  });

  return groups;

}


async function loadPublications() {

  try {

    const response =
      await fetch(
        "data/publications.json",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Could not load publications."
      );
    }

    const data =
      await response.json();

    const publications =
      data.publications || [];


    if (!publications.length) {

      status.textContent =
        "No publications are currently available.";

      return;

    }


    const groups =
      groupByYear(publications);


    let html = "";


    Object.keys(groups)
      .sort((a, b) => {

        if (a === "Other") return 1;
        if (b === "Other") return -1;

        return Number(b) - Number(a);

      })
      .forEach(year => {

        html += `

          <section class="publication-year-section">

            <h2 class="publication-year-heading">
              ${escapeHTML(year)}
            </h2>

            <div class="publication-grid">

              ${
                groups[year]
                  .map(createPublicationCard)
                  .join("")
              }

            </div>

          </section>

        `;

      });


    publicationContainer.innerHTML =
      html;


    const updated =
      data.updated
        ? new Date(data.updated)
        : null;


    if (updated) {

      status.textContent =
        `Automatically synchronized from ORCID · ` +
        `Last updated ${updated.toLocaleDateString()}`;

    } else {

      status.textContent =
        "Automatically synchronized from ORCID.";

    }


  } catch (error) {

    console.error(error);

    status.textContent =
      "Publications could not be loaded. " +
      "Please visit the ORCID or Google Scholar profile below.";

  }

}


document.getElementById(
  "current-year"
).textContent =
  new Date().getFullYear();


loadPublications();

</script>


</body>

</html>
